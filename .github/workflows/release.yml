name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the version-bump commit can be pushed back to main.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Bump patch version
        id: version
        shell: bash
        run: |
          OLD="$(node -p "require('./package.json').version")"
          npm version patch --no-git-tag-version
          NEW="$(node -p "require('./package.json').version")"
          echo "old=${OLD}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${OLD} → ${NEW}"

      - name: Commit and push version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new }} [skip ci]"
          git push

      # Build release notes from commits since the previous version tag.
      # Do this after the bump commit exists, but strip [skip ci] bumps so the
      # release body is not just "chore: bump version…".
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          OLD="${{ steps.version.outputs.old }}"
          NEW="${{ steps.version.outputs.new }}"
          PREV_TAG="v${OLD}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          {
            echo "## What's changed"
            echo
            if git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
              # Range includes the bump commit; filter it out below.
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
              echo
            else
              git log -30 --pretty=format:"- %s (%h)" --no-merges
              echo
            fi
          } | grep -v '\[skip ci\]' > "$NOTES_FILE" || true

          # If filtering left only the header, add a fallback line.
          if ! grep -q '^- ' "$NOTES_FILE"; then
            {
              echo "## What's changed"
              echo
              echo "- Release ${NEW}"
            } > "$NOTES_FILE"
          fi

          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "----- release notes -----"
          cat "$NOTES_FILE"

      - name: Pre-create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          TAG="v${VERSION}"
          TARGET="$(git rev-parse HEAD)"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes"
            gh release edit "$TAG" \
              --notes-file "$NOTES_FILE" \
              --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              --draft \
              --title "$VERSION" \
              --notes-file "$NOTES_FILE" \
              --repo "${{ github.repository }}" \
              --target "$TARGET"
          fi

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bunx vite build
          bunx electron-builder --win --publish always

      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"
          # Re-apply notes in case electron-builder overwrote the body with the bump commit.
          gh release edit "v${{ steps.version.outputs.new }}" \
            --draft=false \
            --notes-file "$NOTES_FILE" \
            --repo "${{ github.repository }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ steps.version.outputs.new }}
          path: release/**/*
          if-no-files-found: error
          retention-days: 14
